<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Arpian — Slide 2 — Okapy</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root {
    --creme: #F3EEE5;
    --chocolat: #221A13;
    --or: #C2A279;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  .slide {
    position: relative;
    width: 1080px; height: 1350px;
    background: var(--chocolat);
    font-family: 'Fraunces', serif;
  }
  .photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 32%;
  }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(24,18,12,0.34) 0%,
        rgba(24,18,12,0.08) 18%,
        rgba(24,18,12,0.06) 42%,
        rgba(24,18,12,0.62) 70%,
        rgba(24,18,12,0.9) 100%);
  }
  .logo {
    position: absolute; top: 88px; left: 80px;
    width: 210px;
    filter: drop-shadow(0 3px 14px rgba(24,18,12,0.7));
  }
  .content {
    position: absolute; left: 80px; right: 80px; bottom: 88px;
    text-align: left; color: var(--creme);
  }
  .kicker {
    font-family: 'Montserrat', sans-serif;
    font-size: 26px; font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--or);
    margin-bottom: 34px;
  }
  h1 {
    font-weight: 600; font-size: 96px; line-height: 1.12;
    text-shadow: 0 4px 30px rgba(24,18,12,0.5);
  }
  h1 .accent {
    font-style: italic; font-weight: 600;
    color: var(--or);
  }
  .body {
    margin-top: 40px;
    font-weight: 400; font-size: 34px; line-height: 1.6;
    text-shadow: 0 2px 18px rgba(24,18,12,0.55);
  }
</style>
</head>
<body>
  <div class="slide">
    <img class="photo" src="assets/okapy-day.jpeg" alt="">
    <div class="scrim"></div>

    <img class="logo" src="assets/arpian-logo-blanc.png" alt="Chalet Arpian">

    <div class="content">
      <div class="kicker">&mdash;&nbsp;01&nbsp;&mdash;&nbsp;En journ&eacute;e</div>
      <h1>Okapy,<br><span class="accent">le paradis des enfants.</span></h1>
      <div class="body">Trampolines, ch&acirc;teaux gonflables et fous rires,<br>&agrave; deux pas du chalet.</div>
    </div>
  </div>
</body>
</html>
