<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Arpian — Post Adults only / Kids friendly</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root {
    --creme: #F3EEE5;
    --chocolat: #221A13;
    --or: #C2A279;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  .slide {
    position: relative;
    width: 1080px; height: 1350px;
    background: var(--chocolat);
    font-family: 'Fraunces', serif;
  }
  .photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 38%;
  }
  /* Scrim haut : porte le bloc texte, s'efface avant l'enfant */
  .scrim-top {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(24,18,12,0.82) 0%,
        rgba(24,18,12,0.70) 26%,
        rgba(24,18,12,0.42) 42%,
        rgba(24,18,12,0.00) 58%);
  }
  /* Scrim bas renforcé : le parquet clair doit porter les étoiles + le logo blanc */
  .scrim-bottom {
    position: absolute; inset: 0;
    background:
      linear-gradient(to top,
        rgba(24,18,12,0.86) 0%,
        rgba(24,18,12,0.68) 14%,
        rgba(24,18,12,0.00) 36%);
  }
  .content {
    position: absolute; left: 70px; right: 70px; top: 84px;
    display: flex; flex-direction: column;
    align-items: center;
    text-align: center; color: var(--creme);
  }
  .kicker {
    font-family: 'Montserrat', sans-serif;
    font-size: 25px; font-weight: 600;
    letter-spacing: 0.28em; text-indent: 0.28em;
    text-transform: uppercase;
    color: var(--or);
    margin-bottom: 38px;
    text-shadow: 0 2px 16px rgba(24,18,12,0.6);
  }
  h1 {
    font-weight: 600; font-size: 84px; line-height: 1.13;
    text-shadow: 0 4px 34px rgba(24,18,12,0.6);
  }
  h1 .accent {
    font-style: italic; font-weight: 600;
    color: var(--or);
  }
  .sub {
    margin-top: 30px;
    font-weight: 400; font-size: 34px; line-height: 1.55;
    text-shadow: 0 2px 20px rgba(24,18,12,0.65);
  }
  .stars {
    position: absolute; bottom: 236px; left: 50%;
    transform: translateX(-50%);
    color: var(--or); font-size: 27px;
    letter-spacing: 0.9em; text-indent: 0.9em;
    text-shadow: 0 2px 14px rgba(24,18,12,0.7);
  }
  .logo {
    position: absolute; bottom: 84px; left: 50%;
    transform: translateX(-50%);
    width: 300px;
    filter: drop-shadow(0 4px 20px rgba(24,18,12,0.7));
  }
</style>
</head>
<body>
  <div class="slide">
    <img class="photo" src="assets/couloir-enfant.jpeg" alt="">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>

    <div class="content">
      <div class="kicker">Valmorel &middot; Savoie &middot; Chalet Arpian</div>
      <h1>Adults only<br>ou kids friendly&#8239;?<br><span class="accent">&Agrave; l&rsquo;Arpian, c&rsquo;est vous<br>qui choisissez.</span></h1>
      <div class="sub">Cousinade au complet ou parenth&egrave;se entre adultes.</div>
    </div>

    <div class="stars">&#10022;&nbsp;&#10022;&nbsp;&#10022;</div>
    <img class="logo" src="assets/arpian-logo-blanc.png" alt="Chalet Arpian — Valmorel">
  </div>
</body>
</html>
