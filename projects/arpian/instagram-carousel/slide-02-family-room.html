<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Arpian — Slide 2 — Family Room</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root {
    --nuit-alpine: #0B1030;
    --neon-glacier: #5B8CFF;
    --neon-valmorel: #FF5C8A;
    --melze: #D9A05B;
    --soleil-altitude: #FFC145;
    --neige: #FBF7F0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  .slide {
    position: relative;
    width: 1080px; height: 1350px;
    background: var(--nuit-alpine);
    font-family: 'Montserrat', sans-serif;
  }
  .photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 28%;
  }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(11,16,48,0.4) 0%,
        rgba(11,16,48,0.05) 16%,
        rgba(11,16,48,0) 40%,
        rgba(11,16,48,0.66) 70%,
        rgba(11,16,48,0.95) 100%);
  }
  .logo {
    position: absolute; top: 56px; left: 50%;
    transform: translateX(-50%);
    width: 330px;
    filter: drop-shadow(0 4px 20px rgba(11,16,48,0.75));
  }
  .content {
    position: absolute; left: 80px; right: 80px; bottom: 150px;
    text-align: center; color: var(--neige);
  }
  .kicker {
    display: inline-flex; align-items: center; gap: 20px;
    font-size: 27px; font-weight: 600;
    letter-spacing: 0.42em; text-indent: 0.42em;
    text-transform: uppercase;
    color: var(--neon-glacier);
    text-shadow: 0 0 18px rgba(91,140,255,0.75);
    margin-bottom: 30px;
  }
  .kicker::before, .kicker::after {
    content: ""; width: 52px; height: 1px;
    background: var(--neon-glacier); opacity: 0.8;
    box-shadow: 0 0 10px rgba(91,140,255,0.9);
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700; font-size: 112px; line-height: 1.02;
    text-shadow: 0 4px 30px rgba(11,16,48,0.55);
  }
  .script {
    font-family: 'Great Vibes', cursive;
    font-weight: 400; font-size: 108px; line-height: 1.15;
    color: var(--neon-valmorel);
    text-shadow:
      0 0 14px rgba(255,92,138,0.85),
      0 0 42px rgba(255,92,138,0.55),
      0 4px 26px rgba(11,16,48,0.5);
    margin-top: 6px;
  }
  .sub {
    margin-top: 34px;
    font-size: 30px; font-weight: 500; line-height: 1.5;
    color: rgba(251,247,240,0.92);
    letter-spacing: 0.02em;
  }
  .footer {
    position: absolute; left: 80px; right: 80px; bottom: 58px;
    display: flex; align-items: center; justify-content: space-between;
    color: rgba(251,247,240,0.9);
  }
  .dots { display: flex; gap: 12px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(251,247,240,0.35); }
  .dot.active { background: var(--neon-valmorel); width: 34px; border-radius: 8px; }
  .handle {
    font-size: 25px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="slide">
    <img class="photo" src="assets/family-room-night.jpeg" alt="">
    <div class="scrim"></div>

    <img class="logo" src="assets/arpian-logo-blanc.png" alt="Chalet Arpian — Valmorel">

    <div class="content">
      <div class="kicker">En soir&eacute;e</div>
      <h1>Notre Family Room,</h1>
      <div class="script">leur paradis du soir</div>
      <div class="sub">Cin&eacute;ma, poufs g&eacute;ants &amp; soir&eacute;es pyjama<br>au c&oelig;ur du chalet</div>
    </div>

    <div class="footer">
      <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot active"></div></div>
      <div class="handle">Chalet Arpian</div>
    </div>
  </div>
</body>
</html>
