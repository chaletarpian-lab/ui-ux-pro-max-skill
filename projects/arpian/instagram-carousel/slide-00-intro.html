<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Arpian — Slide 0 — Intro Valmorel</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root {
    --nuit-alpine: #0B1030;
    --neon-glacier: #5B8CFF;
    --neon-valmorel: #FF5C8A;
    --melze: #D9A05B;
    --soleil-altitude: #FFC145;
    --neige: #FBF7F0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  .slide {
    position: relative;
    width: 1080px; height: 1350px;
    background: var(--nuit-alpine);
    font-family: 'Montserrat', sans-serif;
  }
  .photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: 50% 40%;
  }
  .scrim {
    position: absolute; inset: 0;
    background:
      linear-gradient(to bottom,
        rgba(11,16,48,0.82) 0%,
        rgba(11,16,48,0.5) 20%,
        rgba(11,16,48,0) 45%,
        rgba(11,16,48,0.6) 68%,
        rgba(11,16,48,0.93) 100%);
  }
  .logo {
    position: absolute; top: 88px; left: 50%;
    transform: translateX(-50%);
    width: 520px;
    filter: drop-shadow(0 6px 26px rgba(11,16,48,0.75));
  }
  .content {
    position: absolute; left: 80px; right: 80px; bottom: 150px;
    text-align: center; color: var(--neige);
  }
  .kicker {
    display: inline-flex; align-items: center; gap: 20px;
    font-size: 27px; font-weight: 600;
    letter-spacing: 0.42em; text-indent: 0.42em;
    text-transform: uppercase;
    color: var(--soleil-altitude);
    margin-bottom: 30px;
  }
  .kicker::before, .kicker::after {
    content: ""; width: 52px; height: 1px;
    background: var(--soleil-altitude); opacity: 0.8;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 700; font-size: 104px; line-height: 1.04;
    text-shadow: 0 4px 30px rgba(11,16,48,0.55);
  }
  .script {
    font-family: 'Great Vibes', cursive;
    font-weight: 400; font-size: 112px; line-height: 1.15;
    color: var(--soleil-altitude);
    text-shadow: 0 4px 26px rgba(11,16,48,0.5);
    margin-top: 8px;
  }
  .sub {
    margin-top: 34px;
    font-size: 30px; font-weight: 500; line-height: 1.5;
    color: rgba(251,247,240,0.92);
    letter-spacing: 0.02em;
  }
  .footer {
    position: absolute; left: 80px; right: 80px; bottom: 58px;
    display: flex; align-items: center; justify-content: space-between;
    color: rgba(251,247,240,0.9);
  }
  .dots { display: flex; gap: 12px; align-items: center; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(251,247,240,0.35); }
  .dot.active { background: var(--soleil-altitude); width: 34px; border-radius: 8px; }
  .swipe {
    font-size: 25px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase;
  }
  .swipe .arrow { color: var(--soleil-altitude); margin-left: 10px; }
  .credit {
    position: absolute; right: 18px; top: 50%;
    transform: rotate(90deg) translateX(-50%);
    transform-origin: right top;
    font-size: 16px; font-weight: 500; letter-spacing: 0.08em;
    color: rgba(251,247,240,0.6);
  }
</style>
</head>
<body>
  <div class="slide">
    <img class="photo" src="assets/valmorel-summer.webp" alt="">
    <div class="scrim"></div>

    <img class="logo" src="assets/arpian-logo-blanc.png" alt="Chalet Arpian — Valmorel">

    <div class="content">
      <div class="kicker">Vacances en famille</div>
      <h1>Valmorel avec des enfants&nbsp;?</h1>
      <div class="script">deux paradis par jour</div>
      <div class="sub">Le matin les cimes, l&rsquo;apr&egrave;s-midi les trampolines,<br>le soir le cin&eacute;ma du chalet&hellip;</div>
    </div>

    <div class="credit">&copy; OT Valmorel / Pierre Jacques</div>

    <div class="footer">
      <div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
      <div class="swipe">Suivez le guide<span class="arrow">&#10142;</span></div>
    </div>
  </div>
</body>
</html>
